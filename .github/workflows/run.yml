name: Polarstar Balance Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # UTC 每5分钟

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        run: |
          echo "=== 开始执行 $(date -u) ==="
          python polarstar_monitor.py
          echo "=== 执行结束 $(date -u) ==="
