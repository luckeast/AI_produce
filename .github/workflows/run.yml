name: Polarstar Balance Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # 每5分钟执行一次，UTC时间

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.6'

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控脚本
        run: |
          echo "=== 开始执行 $(date -u) ==="
          python polarstar_monitor.py
          echo "=== 执行结束 $(date -u) ==="
